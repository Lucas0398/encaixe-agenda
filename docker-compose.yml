# Ambiente local: banco + API.
#   docker compose up --build
# O schema em db/schema.sql é aplicado só na primeira subida do volume.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: encaixe
      POSTGRES_PASSWORD: encaixe
      POSTGRES_DB: encaixe
    ports:
      - "5432:5432"
    volumes:
      - dados_db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encaixe"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://encaixe:encaixe@db:5432/encaixe
    ports:
      - "8000:8000"
    volumes:
      - ./credenciais:/app/credenciais:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_db:
